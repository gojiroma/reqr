<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>reqr</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23111%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2770%27 font-family=%27sans-serif%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27%23fff%27%3Er%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom, #faf8f6 0%, #f5f2ef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #3a3a3a;
            font-size: 18px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 24px;
            border: 1px solid #f0ede8;
            width: 100%;
            max-width: 860px;
            padding: 28px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .split-container {
            display: flex;
            gap: 28px;
            align-items: stretch;
        }

        .panel {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;   /* 左右の見出しの高さを揃える */
            gap: 20px;
            background: rgba(250, 248, 246, 0.6);
            padding: 24px;
            border-radius: 18px;
            border: 1px solid #eee9e3;
        }

        /* ---- QRコード ---- */

        .qr-code-area {
            background: white;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #e8e4df;
            display: flex;
            justify-content: center;
        }

        .qr-code-area img {
            width: 100%;
            max-width: 320px;
            height: auto;
            display: block;
        }

        /* 左右のパネルの見出し（うけとる／おくる） */
        .panel-title {
            font-size: 25px;
            font-weight: 800;
            color: #8b7355;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .hint {
            font-size: 19px;
            font-weight: 700;
            color: #a2937f;
            text-align: center;
            line-height: 1.5;
        }

        .sub-hint {
            font-size: 15px;
            color: #9c9289;
            text-align: center;
            min-height: 22px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #b9ae9f;
            font-size: 17px;
            font-weight: 700;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8e4df;
        }

        /* ---- 4桁コード入力（見えない input + マス目） ---- */

        .code-area {
            position: relative;
            cursor: pointer;
        }

        .code-slots {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .slot {
            width: 62px;
            height: 82px;
            border-radius: 14px;
            border: 2px solid #e0d8cd;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 800;
            font-family: 'Monaco', 'Courier New', monospace;
            color: #3a3a3a;
            transition: border-color 0.15s, transform 0.15s;
        }

        .slot.filled {
            border-color: #8b7355;
        }

        .slot.next {
            border-color: #c9b8a8;
            animation: blink 1.1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { border-color: #e0d8cd; }
            50%      { border-color: #8b7355; }
        }

        .code-area.error .slot {
            border-color: #c85a54;
            color: #c85a54;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-5px); }
            75%      { transform: translateX(5px); }
        }

        /* マス目に重ねる透明な input（スマホでテンキーを出すため） */
        .ghost-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            border: none;
            background: transparent;
            font-size: 16px; /* iOSの自動ズーム防止 */
            cursor: pointer;
        }

        .status-message {
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            min-height: 26px;
            color: #9c9289;
        }

        .status-message.error   { color: #c85a54; }
        .status-message.success { color: #6d9160; }

        /* ---- 送る側 ---- */

        .send-panel {
            gap: 18px;
        }

        .big-btn {
            width: 100%;
            padding: 30px 20px;
            border: none;
            border-radius: 18px;
            font-size: 26px;
            font-weight: 800;
            cursor: pointer;
            color: white;
            background: #a89a8f;
            transition: background 0.2s, transform 0.1s;
            line-height: 1.3;
        }

        .big-btn:hover:not(:disabled) { background: #8b7355; }
        .big-btn:active:not(:disabled) { transform: scale(0.98); }

        .big-btn:disabled {
            background: #ddd4cc;
            color: #a9a09a;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 26px;
            height: 26px;
            border: 3px solid #e8e4df;
            border-top: 3px solid #8b7355;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            padding: 22px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #e8e4df;
            background: white;
        }

        .result.success { display: block; border-color: #7a9e6f; background: #f4f8f1; }
        .result.error   { display: block; border-color: #c85a54; background: #fbf2f0; }

        .result-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .result.success .result-title { color: #4a5f43; }
        .result.error   .result-title { color: #a24a44; }

        .result-number {
            font-size: 62px;
            font-weight: 800;
            letter-spacing: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            color: #3a3a3a;
            margin-bottom: 10px;
        }

        .result-number:empty { display: none; }

        .result-description {
            font-size: 17px;
            line-height: 1.6;
            color: #6b6b6b;
            margin-bottom: 16px;
        }

        .copy-btn {
            background: white;
            color: #6b6b6b;
            border: 2px solid #ddd4cc;
            padding: 12px 24px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
        }

        .copy-btn:hover { background: #faf8f6; }

        .result.error .copy-btn { display: none; }

        @media (max-width: 820px) {
            .split-container { flex-direction: column; }
            .qr-code-area img { max-width: 260px; }
        }

        @media (max-width: 480px) {
            body { font-size: 17px; }
            .container { padding: 12px; }
            .card { padding: 14px; border-radius: 18px; }
            .split-container { gap: 16px; }
            .panel { padding: 14px; gap: 14px; }
            .panel-title { font-size: 22px; }
            .qr-code-area { padding: 10px; }
            .qr-code-area img { max-width: 190px; }
            .hint { font-size: 18px; }
            .slot { width: 54px; height: 70px; font-size: 38px; }
            .big-btn { font-size: 21px; padding: 22px 14px; }
            .result-number { font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
          <div class="split-container">

            <!-- もらう側：QRコード＋4桁コード -->
            <section class="panel receive-panel">
              <div class="panel-title" id="receiveHint">リンクを うけとる</div>

              <div class="qr-code-area">
                <img src="data:image/png;base64,{{ qr_code }}" alt="QR">
              </div>
              <div class="hint" id="qrHint">スマホで よみとってね</div>

              <div class="divider" id="dividerText">それか</div>

              <div class="code-area" id="codeArea">
                <div class="code-slots" id="codeSlots">
                  <div class="slot"></div>
                  <div class="slot"></div>
                  <div class="slot"></div>
                  <div class="slot"></div>
                </div>
                <input class="ghost-input" id="ghostInput" type="text" maxlength="4"
                       inputmode="numeric" pattern="[0-9]*" autocomplete="off"
                       aria-label="4桁のコード">
              </div>
              <div class="hint" id="codeHint">すうじ 4つ うってね</div>
              <div class="status-message" id="reservationStatus"></div>
            </section>

            <!-- おくる側：ボタンひとつ -->
            <section class="panel send-panel">
              <div class="panel-title" id="sendHint">リンクを おくる</div>

              <button class="big-btn" id="clipboardBtn" onclick="sendFromClipboard()">
                📋 <span id="clipboardBtnText">コピーした リンクを おくる</span>
              </button>

              <div class="sub-hint" id="pasteHint">⌘V でも おくれるよ</div>

              <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; font-size: 17px; color: #9c9289;" id="generatingText">まってね…</p>
              </div>

              <div class="result" id="result">
                <div class="result-title" id="resultTitle"></div>
                <div class="result-number" id="resultNumber"></div>
                <div class="result-description" id="resultDescription"></div>
                <button class="copy-btn" id="copyBtn" onclick="copyNumber()">すうじを コピー</button>
              </div>
            </section>

          </div>
        </div>
    </div>

    <script>
        const currentLang = navigator.language.startsWith('ja') ? 'ja' : 'en';
        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);

        const translations = {
            ja: {
                receiveHint: 'リンクを うけとる',
                qrHint: 'スマホで よみとってね',
                dividerText: 'それか',
                codeHint: 'すうじ 4つ うってね',
                sendHint: 'リンクを おくる',
                clipboardBtnText: 'コピーした リンクを おくる',
                pasteHint: isMac ? '⌘V でも おくれるよ' : 'Ctrl+V でも おくれるよ',
                generatingText: 'まってね…',
                copyBtnText: 'すうじを コピー',
                copied: 'コピーしたよ！',
                connecting: 'つながったよ！ ひらくね',
                codeNotFound: 'その すうじ ないよ',
                connectionError: 'つながらないよ',
                generateSuccess: 'できた！',
                generatedDesc: 'この すうじを あいてに おしえてね。 1かい つかったら おしまいだよ。',
                errorOccurred: 'うまく いかなかった',
                networkError: 'つながらないよ',
                networkErrorDesc: 'もういちど おしてみてね',
                emptyClipboard: 'なにも コピーしてないよ',
                emptyClipboardDesc: 'まず リンクを コピーしてね',
                invalidUrl: 'それ リンクじゃないよ',
                invalidUrlDesc: 'http で はじまる やつを コピーしてね',
                clipboardError: 'よみとれなかった',
                clipboardErrorDesc: isMac ? '⌘V を おしてみてね' : 'Ctrl+V を おしてみてね'
            },
            en: {
                receiveHint: 'Get a link',
                qrHint: 'Scan me with your phone',
                dividerText: 'or',
                codeHint: 'Type the 4 numbers',
                sendHint: 'Send a link',
                clipboardBtnText: 'Send the link you copied',
                pasteHint: isMac ? 'You can press ⌘V too' : 'You can press Ctrl+V too',
                generatingText: 'One sec…',
                copyBtnText: 'Copy the numbers',
                copied: 'Copied!',
                connecting: 'Got it! Opening…',
                codeNotFound: 'No such numbers',
                connectionError: "Can't connect",
                generateSuccess: 'All done!',
                generatedDesc: 'Tell your friend these numbers. They work one time only.',
                errorOccurred: 'That did not work',
                networkError: "Can't connect",
                networkErrorDesc: 'Try pressing it again',
                emptyClipboard: 'You did not copy anything',
                emptyClipboardDesc: 'Copy a link first',
                invalidUrl: "That's not a link",
                invalidUrlDesc: 'Copy something starting with http',
                clipboardError: "Couldn't read it",
                clipboardErrorDesc: isMac ? 'Try pressing ⌘V' : 'Try pressing Ctrl+V'
            }
        };

        function t(key) {
            return translations[currentLang][key] || translations['ja'][key];
        }

        const roomId = '{{ room_id }}';

        const codeArea = document.getElementById('codeArea');
        const ghostInput = document.getElementById('ghostInput');
        const slots = document.querySelectorAll('#codeSlots .slot');
        const reservationStatus = document.getElementById('reservationStatus');
        const clipboardBtn = document.getElementById('clipboardBtn');
        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultNumber = document.getElementById('resultNumber');
        const resultDescription = document.getElementById('resultDescription');
        const loading = document.getElementById('loading');
        const copyBtn = document.getElementById('copyBtn');

        function applyTranslations() {
            const map = {
                receiveHint: 'receiveHint', qrHint: 'qrHint', dividerText: 'dividerText',
                codeHint: 'codeHint', sendHint: 'sendHint', clipboardBtnText: 'clipboardBtnText',
                pasteHint: 'pasteHint', generatingText: 'generatingText'
            };
            for (const id in map) {
                const el = document.getElementById(id);
                if (el) el.textContent = t(map[id]);
            }
            copyBtn.textContent = t('copyBtnText');
        }
        applyTranslations();

        /* ---------- 4桁コード ---------- */

        let code = '';
        let locked = false;   // 送信中はキー入力を無視

        function renderCode() {
            slots.forEach((slot, i) => {
                slot.textContent = code[i] || '';
                slot.classList.toggle('filled', i < code.length);
                slot.classList.toggle('next', i === code.length && !locked);
            });
        }

        function setCode(value) {
            code = value.replace(/\D/g, '').slice(0, 4);
            ghostInput.value = code;
            renderCode();
            if (code.length === 4) applyReservation();
        }

        function clearCode() {
            codeArea.classList.remove('error');
            setCode('');
        }

        function showCodeError(message) {
            codeArea.classList.add('error');
            reservationStatus.textContent = '✗ ' + message;
            reservationStatus.className = 'status-message error';
            setTimeout(() => {
                reservationStatus.textContent = '';
                reservationStatus.className = 'status-message';
                clearCode();
            }, 1800);
        }

        // スマホ：マス目をタップ → テンキーが出る
        ghostInput.addEventListener('input', () => {
            if (locked) { ghostInput.value = code; return; }
            setCode(ghostInput.value);
        });

        // PC：どこにも触らず、そのままキーボードを待つ
        document.addEventListener('keydown', (e) => {
            if (locked) return;
            if (e.metaKey || e.ctrlKey || e.altKey) return;      // ⌘V などは邪魔しない
            if (document.activeElement === ghostInput) return;   // input側で処理済み

            if (/^[0-9]$/.test(e.key)) {
                e.preventDefault();
                codeArea.classList.remove('error');
                setCode(code + e.key);
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                codeArea.classList.remove('error');
                setCode(code.slice(0, -1));
            }
        });

        async function applyReservation() {
            locked = true;
            renderCode();
            try {
                const res = await fetch('/apply_reservation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room_id: roomId, reservation_number: code })
                });

                if (res.ok) {
                    reservationStatus.textContent = '✓ ' + t('connecting');
                    reservationStatus.className = 'status-message success';
                    setTimeout(checkStatus, 400);
                } else {
                    locked = false;
                    showCodeError(t('codeNotFound'));
                }
            } catch (err) {
                locked = false;
                showCodeError(t('connectionError'));
            }
        }

        /* ---------- リンクを送る ---------- */

        function showResult(kind, title, description, number) {
            resultTitle.textContent = (kind === 'success' ? '✓ ' : '✗ ') + title;
            resultNumber.textContent = number || '';
            resultDescription.textContent = description;
            result.className = 'result ' + kind;
            copyBtn.textContent = t('copyBtnText');
        }

        function setBusy(busy) {
            clipboardBtn.disabled = busy;
            loading.style.display = busy ? 'block' : 'none';
        }

        async function sendUrl(url) {
            setBusy(true);
            result.className = 'result';

            try {
                const res = await fetch('/create_reservation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();

                if (res.ok) {
                    showResult('success', t('generateSuccess'), t('generatedDesc'), data.reservation_number);
                } else {
                    showResult('error', t('errorOccurred'), data.error || t('errorOccurred'));
                }
            } catch (err) {
                showResult('error', t('networkError'), t('networkErrorDesc'));
            } finally {
                setBusy(false);
            }
        }

        // クリップボードの中身を確かめてから送る
        function handleClipboardText(text) {
            const url = (text || '').trim();

            if (!url) {
                setBusy(false);
                showResult('error', t('emptyClipboard'), t('emptyClipboardDesc'));
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                setBusy(false);
                showResult('error', t('invalidUrl'), t('invalidUrlDesc'));
                return;
            }
            sendUrl(url);
        }

        let clipboardBusy = false;

        async function sendFromClipboard() {
            if (clipboardBusy) return;

            // http や Firefox など readText が無い環境はすぐ ⌘V を案内
            if (!navigator.clipboard || !navigator.clipboard.readText) {
                showResult('error', t('clipboardError'), t('clipboardErrorDesc'));
                return;
            }

            clipboardBusy = true;
            setBusy(true);
            result.className = 'result';

            // Safari は「ペースト」の確認を出す。押されないと readText が返ってこないので、
            // 待ちっぱなしにならないよう時間を切って ⌘V を案内する
            let settled = false;
            const timer = setTimeout(() => {
                if (settled) return;
                setBusy(false);
                showResult('error', t('clipboardError'), t('clipboardErrorDesc'));
            }, 6000);

            try {
                const text = await navigator.clipboard.readText();
                settled = true;
                clearTimeout(timer);
                handleClipboardText(text);   // 遅れて許可された場合もここで送れる
            } catch (err) {
                settled = true;
                clearTimeout(timer);
                setBusy(false);
                showResult('error', t('clipboardError'), t('clipboardErrorDesc'));
            } finally {
                clipboardBusy = false;
            }
        }

        // ⌘V / Ctrl+V での貼り付け
        document.addEventListener('paste', (e) => {
            if (document.activeElement === ghostInput) return;
            const text = (e.clipboardData || window.clipboardData).getData('text');
            e.preventDefault();
            handleClipboardText(text);
        });

        function copyNumber() {
            navigator.clipboard.writeText(resultNumber.textContent).then(() => {
                copyBtn.textContent = '✓ ' + t('copied');
                setTimeout(() => { copyBtn.textContent = t('copyBtnText'); }, 2000);
            }).catch(() => {
                copyBtn.textContent = '✗ ' + t('clipboardError');
                setTimeout(() => { copyBtn.textContent = t('copyBtnText'); }, 2000);
            });
        }

        /* ---------- 相手からURLが届いたか見張る ---------- */

        async function checkStatus() {
            try {
                const res = await fetch(`/status/${roomId}`);
                if (!res.ok) return;
                const data = await res.json();
                if (data.url) window.location.href = data.url;
            } catch (err) {
                console.warn('status check failed', err);
            }
        }

        renderCode();
        checkStatus();
        setInterval(checkStatus, 800);
    </script>
</body>
</html>
