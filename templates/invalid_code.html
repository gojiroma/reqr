<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reqr - Code Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #faf8f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #3a3a3a;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            padding: 40px;
            border: 1px solid #e8e4df;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #c85a54;
        }

        .title {
            font-size: 30px;
            font-weight: 800;
            color: #8b7355;
            margin-bottom: 20px;
        }

        .code-display {
            display: inline-block;
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            background: #faf8f6;
            border: 3px dashed #c85a54;
            padding: 14px 28px;
            border-radius: 14px;
            color: #c85a54;
            margin-bottom: 26px;
        }

        .message {
            font-size: 20px;
            color: #666;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 21px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            background: #a89a8f;
            color: white;
        }

        .btn:hover {
            background: #8b7355;
            box-shadow: 0 4px 12px rgba(139, 115, 85, 0.2);
        }


    </style>
</head>

<body>


    <div class="container">
        <div class="card">
            <div class="error-icon">⚠️</div>
            <div class="title" id="errorTitle">この すうじ ないよ</div>

            <div class="code-display">{{ code }}</div>

            <div class="message" id="errorMessage">
                もう つかわれたか、まちがってるみたい。あいてに もういちど すうじを おしえてもらってね。
            </div>

            <a href="/" class="btn" id="backBtn">さいしょに もどる</a>
        </div>
    </div>

    <script>
        let currentLang = navigator.language.startsWith('ja') ? 'ja' : 'en';

        const translations = {
            ja: {
                title: 'reqr - この すうじ ないよ',
                errorTitle: 'この すうじ ないよ',
                errorMessage: 'もう つかわれたか、まちがってるみたい。あいてに もういちど すうじを おしえてもらってね。',
                backBtn: 'さいしょに もどる'
            },
            en: {
                title: 'reqr - No such numbers',
                errorTitle: 'No such numbers',
                errorMessage: 'These numbers were already used, or something was typed wrong. Ask your friend for the numbers again.',
                backBtn: 'Go back to the start'
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            


            // テキストの更新
            document.title = translations[lang].title;
            document.getElementById('errorTitle').textContent = translations[lang].errorTitle;
            document.getElementById('errorMessage').textContent = translations[lang].errorMessage;
            document.getElementById('backBtn').textContent = translations[lang].backBtn;
        }

        // 初期ロード時の言語設定
        window.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
        });
    </script>
</body>

</html>
